name: Client CI

on:
  pull_request:
    paths:
      - 'client/**'
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Install server (E2E game server)
        working-directory: server
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Dependency boundaries
        run: npm run check:deps

      - name: Multiplayer architecture boundaries
        run: npm run check:multiplayer-arch

      - name: Multiplayer dependency cycles
        run: npm run check:multiplayer-cycles

      - name: Socket event registry ownership
        run: npm run check:socket-registry

      - name: Architecture invariant enforcement
        run: npm run check:architecture

      - name: Test
        run: npm run test:coverage

      - name: Behavior tests
        run: npm run test:all

      - name: E2E tests
        run: npx playwright install chromium --with-deps && npm run e2e

      - name: Build
        run: npm run build

      - name: Bundle size check
        run: npm run size-check

      - name: Bot match lazy-load boundaries
        run: npm run check:bot-match-lazy
