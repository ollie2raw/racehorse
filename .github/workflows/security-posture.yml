name: Security posture

# Weekly drift detector for the prod Supabase schema. Backs the
# assert_security_posture() RPC (supabase/migrations/2026-09-01_assert_security_posture_rpc.sql).
# Exists because there is no CI migration runner — three reviewed lockdown
# migrations had sat unapplied before this was built (2026-09-01 incident).

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  posture:
    runs-on: ubuntu-latest
    steps:
      - name: assert_security_posture() against prod
        env:
          # Not a secret — also hardcoded in ci.yml. The service key IS a secret
          # and is only ever passed as a header, never echoed.
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -X POST \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            "$SUPABASE_URL/rest/v1/rpc/assert_security_posture")"

          echo "$resp" | jq .   # response carries no secrets

          hard="$(echo "$resp" | jq -r '.hard_fail_count // "ERR"')"
          adv="$(echo  "$resp" | jq -r '.advisory_count // 0')"

          if [ "$hard" = "ERR" ]; then
            echo "::error::assert_security_posture() did not return the expected shape (RPC missing / not applied?)"
            exit 1
          fi
          if [ "$adv" -gt 0 ]; then
            echo "::warning::${adv} advisory finding(s) — see report above"
          fi
          if [ "$hard" -gt 0 ]; then
            echo "::error::${hard} HARD security-posture failure(s)"
            echo "$resp" | jq '.hard_fails'
            exit 1
          fi
          echo "security posture clean (${adv} advisories)"

  policy-manifest:
    # Guardrail #1 (ENGINEERING_GUARDRAILS.md). assert_security_posture()
    # above checks RLS-enabled / grant-level posture; it deliberately does
    # NOT inspect individual policy predicates, which is exactly the gap
    # RK-0 (a policy named for service_role but scoped to public) slipped
    # through. This job diffs the live pg_policies rows for every pinned
    # table against supabase/policy-manifest.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check RLS policy manifest against prod
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run check:policy-manifest --prefix server

  cascade-delete-completeness:
    # Guardrail #6 (ENGINEERING_GUARDRAILS.md). assert_security_posture()
    # and the policy-manifest job above check RLS; neither looks at foreign-key
    # delete actions. SA-6 (bot_match_pending's user_id FK, no ON DELETE action
    # → RESTRICT) 500'd DELETE /api/account for every affected user and was
    # found only by a human tracing the account-deletion flow. This job diffs
    # every live FK targeting profiles(id)/auth.users(id) against
    # supabase/cascade-delete-allowlist.json — anything non-cascade that isn't
    # a recorded exception fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check cascade-delete completeness against prod
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run check:cascade-delete --prefix server

  published-artifact-freshness:
    # Guardrail #7 (ENGINEERING_GUARDRAILS.md). DF-STALE-1: a Daily Fritz
    # published challenge is pre-generated a day ahead and frozen; a version
    # constant bumped before the run date rolls over left the serving path
    # re-deriving the package and hard-failing on the digest mismatch. INV-19
    # pins the reuse-first serving fix. This job is proactive detection: for
    # every future-dated published row it runs the same validity oracle /start
    # would, so a row that will 500 on its effective date is caught on the day
    # of the bump instead. Tolerated drift (a supported prior policy version the
    # reuse path absorbs) is reported, not failed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Check published-artifact freshness against prod
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run check:published-freshness --prefix server
