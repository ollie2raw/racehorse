name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy-client:
    name: Deploy Client to Vercel
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_MHn6ZEtiPq7T2ihcmZR57cmP
      VERCEL_PROJECT_ID: prj_CQ0B3tYtL1MAHUjAzy7EM1IYs93e
    steps:
      - uses: actions/checkout@v5
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: client
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: client
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        working-directory: client
      - name: Verify deployment responds
        run: curl -fsS "${{ steps.deploy.outputs.url }}" -o /dev/null

  deploy-server:
    name: Deploy Server to Vercel
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Deployed from the repo root (not server/) so npm workspaces can
      # resolve the internal @racehorse/game-core package — see vercel.json
      # and api/index.ts at the repo root.
      VERCEL_ORG_ID: team_MHn6ZEtiPq7T2ihcmZR57cmP
      VERCEL_PROJECT_ID: prj_9nhIDblyt0JjU20tCQ1cL3wIGFY1
    steps:
      - uses: actions/checkout@v5
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify deployment is healthy
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/ready" | grep -q '"ok":true'; then
              echo "Deployment healthy."
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 10
          done
          echo "Deployment did not report healthy within the retry window."
          exit 1
