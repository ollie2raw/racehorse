name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  server:
    name: Server Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Verify game-core resolves under Node
        run: node -e "require('@racehorse/game-core'); console.log('game-core ok')"

      - name: Server tests
        env:
          TZ: America/Los_Angeles
          # Also mirrored in server/vitest.config.ts poolOptions.forks.execArgv.
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run test --prefix server

      - name: Typecheck Daily Fritz authority soak harness
        run: npm run typecheck:scripts --prefix server

      - name: Server build
        run: npm run build --prefix server

      - name: Verify server dist can load game-core
        run: node -e "require('./server/dist/game/engine.js'); console.log('dist engine ok')"

  client:
    name: Client Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Typecheck
        run: npm run typecheck --prefix client

      - name: Lint TS/JS
        run: npm run lint --prefix client

      - name: Lint CSS
        run: npm run lint:css --prefix client

      - name: Dependency boundaries
        run: npm run check:deps --prefix client

      - name: Multiplayer architecture boundaries
        run: npm run check:multiplayer-arch --prefix client

      - name: Multiplayer dependency cycles
        run: npm run check:multiplayer-cycles --prefix client

      - name: Socket event registry ownership
        run: npm run check:socket-registry --prefix client

      - name: Architecture invariant enforcement
        run: npm run check:architecture --prefix client

      - name: Client tests
        run: npm run test:all --prefix client

      - name: Build server (socket smoke + rematch E2E need dist scoring helpers)
        run: npm run build --prefix server

      - name: Playwright E2E tests
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MP_PRIVATE_CERT_MODE: '1'
        run: |
          npx playwright install chromium --with-deps
          npm run e2e --prefix client

      - name: Client build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build --prefix client

      - name: Bundle size check
        run: npm run size-check --prefix client

      - name: Upload source maps to Sentry
        if: github.ref == 'refs/heads/main' && env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli@2 releases new "${{ github.sha }}"
          npx @sentry/cli@2 releases files "${{ github.sha }}" upload-sourcemaps client/dist --url-prefix '~/' --rewrite
          npx @sentry/cli@2 releases finalize "${{ github.sha }}"
          npx @sentry/cli@2 releases deploys "${{ github.sha }}" new -e production

      - name: Lighthouse CI
        run: |
          npx --yes @lhci/cli@0.14 autorun \
            --collect.staticDistDir=client/dist \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance=["warn",{"minScore":0.9}] \
            --assert.assertions.categories:accessibility=["warn",{"minScore":0.9}] \
            --assert.assertions.categories:best-practices=["warn",{"minScore":0.9}] \
            --assert.assertions.categories:seo=["warn",{"minScore":0.9}] \
            --upload.target=temporary-public-storage \
          || true

      - name: Bot match lazy-load boundaries
        run: npm run check:bot-match-lazy --prefix client

  mp-private-soak:
    name: MP Private Authority Soak
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Build server
        run: npm run build --prefix server

      - name: Start server (cert mode)
        env:
          MP_PRIVATE_CERT_MODE: '1'
          # Same live Supabase as Playwright — fake URLs mark rooms persistence-failed and block start.
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node server/dist/index.js > /tmp/mp-soak-server.log 2>&1 &
          echo $! > /tmp/mp-soak-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ping >/dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to become ready"
          tail -n 200 /tmp/mp-soak-server.log || true
          exit 1

      - name: Run private authority soak (2 waves)
        env:
          MP_PRIVATE_CERT_MODE: '1'
          SMOKE_REQUIRE_CERT: '0'
          MP_SOAK_WAVES: '2'
          SMOKE_TIMEOUT_MS: '45000'
          SMOKE_SERVER_URL: http://127.0.0.1:3001
          # Keep CI soak to the private create/start/leave vertical proven green under
          # live-session flush. Broader reconnect/rematch waves stay local for now.
          MP_SOAK_SCENARIOS: private-create-join-start-move,private-midmatch-leave-forfeit
        run: npm run soak:mp-private-authority --prefix client

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/mp-soak-server.pid ]; then
            kill "$(cat /tmp/mp-soak-server.pid)" || true
          fi
          tail -n 100 /tmp/mp-soak-server.log || true
