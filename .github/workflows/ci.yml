name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  server:
    name: Server Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Verify game-core resolves under Node
        run: node -e "require('@racehorse/game-core'); console.log('game-core ok')"

      - name: Server tests
        env:
          TZ: America/Los_Angeles
          # Vitest workers on Node 24 routinely OOM the default ~2GB heap on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test --prefix server -- --maxWorkers=2

      - name: Server build
        run: npm run build --prefix server

      - name: Verify server dist can load game-core
        run: node -e "require('./server/dist/game/engine.js'); console.log('dist engine ok')"

  client:
    name: Client Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Typecheck
        run: npm run typecheck --prefix client

      - name: Lint TS/JS
        run: npm run lint --prefix client

      - name: Lint CSS
        run: npm run lint:css --prefix client

      - name: Dependency boundaries
        run: npm run check:deps --prefix client

      - name: Multiplayer architecture boundaries
        run: npm run check:multiplayer-arch --prefix client

      - name: Multiplayer dependency cycles
        run: npm run check:multiplayer-cycles --prefix client

      - name: Socket event registry ownership
        run: npm run check:socket-registry --prefix client

      - name: Architecture invariant enforcement
        run: npm run check:architecture --prefix client

      - name: Client tests
        run: npm run test:all --prefix client

      - name: Playwright E2E tests
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npx playwright install chromium --with-deps
          npm run e2e --prefix client

      - name: Client build
        run: npm run build --prefix client

      - name: Bundle size check
        run: npm run size-check --prefix client

      - name: Bot match lazy-load boundaries
        run: npm run check:bot-match-lazy --prefix client

  mp-private-soak:
    name: MP Private Authority Soak
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Build server
        run: npm run build --prefix server

      - name: Start server (cert mode)
        env:
          MP_PRIVATE_CERT_MODE: '1'
          # Minimal env so server boots without real Supabase for socket protocol soak.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: soak-placeholder-service-key
        run: |
          node server/dist/index.js > /tmp/mp-soak-server.log 2>&1 &
          echo $! > /tmp/mp-soak-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ping >/dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to become ready"
          tail -n 200 /tmp/mp-soak-server.log || true
          exit 1

      - name: Run private authority soak (3 waves)
        env:
          MP_PRIVATE_CERT_MODE: '1'
          SMOKE_REQUIRE_CERT: '1'
          MP_SOAK_WAVES: '3'
          SMOKE_SERVER_URL: http://127.0.0.1:3001
        run: npm run soak:mp-private-authority --prefix client

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/mp-soak-server.pid ]; then
            kill "$(cat /tmp/mp-soak-server.pid)" || true
          fi
          tail -n 100 /tmp/mp-soak-server.log || true
