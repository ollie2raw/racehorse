name: Daily Fritz Authority Soak

# Runs the Game 1 authority soak against a server started inside this job,
# backed by the DEV Supabase project (org racehorse-dev). It never targets
# production: the soak creates and deletes auth users wherever SUPABASE_URL
# points. See docs/ops/dev-supabase-project.md §6.

on:
  workflow_dispatch:
    inputs:
      users:
        description: Number of ephemeral authenticated players
        required: true
        default: '5'
        type: string
      concurrency:
        description: Concurrent player wave size
        required: true
        default: '2'
        type: string
      run_date:
        description: Optional non-production YYYY-MM-DD challenge fixture date
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: daily-fritz-authority-soak
  cancel-in-progress: false

jobs:
  authority-soak:
    name: Game 1 authority and recovery soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared game core
        run: npm run build -w @racehorse/game-core

      - name: Typecheck authority harness
        run: npm run typecheck:scripts --prefix server

      - name: Build server
        run: npm run build --prefix server

      - name: Start server (dev Supabase, transactional Daily Fritz)
        env:
          DAILY_FRITZ_TRANSACTIONAL_COMMANDS: 'true'
          PORT: '3001'
        run: |
          node server/dist/index.js > /tmp/df-soak-server.log 2>&1 &
          echo $! > /tmp/df-soak-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ping >/dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to become ready"
          tail -n 200 /tmp/df-soak-server.log || true
          exit 1

      - name: Run authority soak
        env:
          DAILY_FRITZ_SOAK_BASE_URL: http://127.0.0.1:3001
          DAILY_FRITZ_SOAK_USERS: ${{ inputs.users }}
          DAILY_FRITZ_SOAK_CONCURRENCY: ${{ inputs.concurrency }}
          DAILY_FRITZ_SOAK_RUN_DATE: ${{ inputs.run_date }}
        run: npm run soak:daily-fritz-authority --prefix server

      - name: Stop server
        if: always()
        run: |
          kill "$(cat /tmp/df-soak-server.pid)" || true
          tail -n 100 /tmp/df-soak-server.log || true
