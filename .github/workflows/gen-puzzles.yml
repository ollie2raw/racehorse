name: Generate Daily Puzzle Ladders

on:
  schedule:
    # Run every 6 hours to self-heal missing dates quickly.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx

      - name: Generate ladders (backfill + lookahead)
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Daily Puzzle resets at midnight Pacific; seed ladder slots using PT calendar days.
          export TZ=America/Los_Angeles
          # Get current date in PT, then calculate back 2 days for safe backfill.
          FROM=$(date -d "-2 days" +%Y-%m-%d 2>/dev/null || date -v-2d +%Y-%m-%d)
          echo "Generating ladder slots from $FROM for 365 days..."
          # 365-day rolling window keeps today + one year of future ladders pre-generated.
          bash scripts/gen-puzzles.sh --from "$FROM" --days 365 --overwrite-existing
