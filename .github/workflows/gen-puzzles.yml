name: Generate Daily Puzzles

on:
  schedule:
    # Run every 6 hours to self-heal missing dates quickly.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install -g tsx

      - name: Generate puzzles (backfill + lookahead)
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Daily Puzzle resets at midnight Pacific; generate using PT calendar days.
          export TZ=America/Los_Angeles
          FROM=$(date -d "-1 day" +%Y-%m-%d 2>/dev/null || date -v-1d +%Y-%m-%d)
          # 45-day rolling window keeps today + near-future pre-generated.
          bash scripts/gen-puzzles.sh --from "$FROM" --days 45 --overwrite-existing
