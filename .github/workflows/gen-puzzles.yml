name: Generate Daily Puzzle Ladders

on:
  schedule:
    # Run every 6 hours to self-heal missing dates quickly.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # Workspace install required so @racehorse/game-core is linked for tsx seed scripts.
      - name: Install dependencies
        run: npm ci

      # @racehorse/game-core exports compiled runtime files from dist/.
      - name: Build game-core
        run: npm run build -w @racehorse/game-core

      - name: Install tsx
        run: npm install -g tsx

      - name: Generate ladders (backfill + lookahead)
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Daily Puzzle resets at midnight Pacific; seed ladder slots using PT calendar days.
          export TZ=America/Los_Angeles
          # Get current date in PT, then calculate back 2 days for safe backfill.
          FROM=$(date -d "-2 days" +%Y-%m-%d 2>/dev/null || date -v-2d +%Y-%m-%d)
          echo "Generating ladder slots from $FROM for 365 days..."
          # By removing --overwrite-existing, we allow the script to skip already-ready dates.
          # This ensures that each 6-hour run makes progress on missing dates without
          # wasting time re-generating thousands of existing puzzles.
          bash scripts/gen-puzzles.sh --from "$FROM" --days 365

      - name: Verify today Pacific ladder is publish-ready
        env:
          SUPABASE_URL: https://fisfadjqllojdzibcdfx.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          export TZ=America/Los_Angeles
          TODAY=$(date +%F)
          echo "Diagnosing ladder readiness for $TODAY (Pacific)..."
          npx tsx server/src/seedDailyPuzzleLadder.ts --date "$TODAY" --diagnose
